<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO Kanban</title>

<!-- =====================================================================
     STYLES
     ===================================================================== -->
<style>
  /* ---------- Design tokens: blue palette, semantic roles, spacing ---------- */
  :root {
    /* Blue scale (primary brand colour) */
    --blue-950: #172554;
    --blue-900: #1e3a8a;
    --blue-800: #1e40af;
    --blue-700: #1d4ed8;
    --blue-600: #2563eb;
    --blue-500: #3b82f6;
    --blue-400: #60a5fa;
    --blue-300: #93c5fd;
    --blue-200: #bfdbfe;
    --blue-100: #dbeafe;
    --blue-50:  #eff6ff;

    /* Cool neutrals */
    --slate-900: #0f172a;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50:  #f8fafc;
    --white:     #ffffff;

    /* Semantic roles */
    --color-bg:          #f3f7fe;
    --color-surface:     var(--white);
    --color-column:      #e6eefc;
    --color-border:      #d6e2f5;
    --color-text:        var(--slate-900);
    --color-text-muted:  var(--slate-600);
    --color-heading:     var(--blue-950);
    --color-primary:     var(--blue-600);
    --color-primary-hover: var(--blue-700);

    /* Entity colours: shared by board accents and pie slices, so an entity
       keeps one colour everywhere. Each set was run through the dataviz
       palette validator (adjacent CVD and normal-vision separation pass). */
    --status-backlog:    #a78bfa;
    --status-inprogress: var(--blue-600);
    --status-blocked:    #dc2626;
    --status-done:       #15803d;

    --prio-critical:    #dc2626;
    --prio-critical-text: #b91c1c;
    --prio-critical-bg: #fef2f2;
    --prio-high:        #eda100;
    --prio-high-text:   #92400e;
    --prio-high-bg:     #fffbeb;
    --prio-medium:      var(--blue-600);
    --prio-medium-bg:   var(--blue-50);
    --prio-low:         #a78bfa;
    --prio-low-text:    #5b21b6;
    --prio-low-bg:      #f5f3ff;

    /* Categorical order for the project pie (fixed order, never cycled) */
    --viz-1: #2a78d6;
    --viz-2: #eb6834;
    --viz-3: #1baf7a;
    --viz-4: #eda100;
    --viz-5: #e87ba4;
    --viz-6: #008300;

    --success:    #15803d;
    --success-bg: #f0fdf4;
    --warning:    #92400e;
    --warning-bg: #fffbeb;
    --danger:     #b91c1c;
    --danger-hover: #991b1b;
    --danger-bg:  #fef2f2;
    --danger-border: #fecaca;

    --focus-ring: var(--blue-600);

    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;

    --radius-sm: 6px;
    --radius:    10px;
    --radius-lg: 14px;
    --radius-pill: 999px;

    --shadow-sm: 0 1px 2px rgba(23, 37, 84, 0.06), 0 1px 3px rgba(23, 37, 84, 0.06);
    --shadow:    0 4px 12px rgba(23, 37, 84, 0.10);
    --shadow-lg: 0 20px 40px rgba(23, 37, 84, 0.22);

    --ease: cubic-bezier(0.2, 0, 0, 1);
    --dur-fast: 150ms;
    --dur: 200ms;

    --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    color: var(--color-text);
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg { flex-shrink: 0; }

  :focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 40px;
    padding: var(--space-2) var(--space-4);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--blue-800);
    font-weight: 600;
    white-space: nowrap;
    transition: background-color var(--dur-fast) var(--ease),
                border-color var(--dur-fast) var(--ease),
                box-shadow var(--dur-fast) var(--ease),
                transform var(--dur-fast) var(--ease);
  }
  .btn:hover { background: var(--blue-50); border-color: var(--blue-300); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: 0.7; cursor: progress; transform: none; }

  .btn-primary {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--white);
    box-shadow: 0 1px 2px rgba(29, 78, 216, 0.3);
  }
  .btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
  .btn-primary[disabled]:hover { background: var(--color-primary); }

  .btn-accent {
    background: var(--white);
    border-color: var(--white);
    color: var(--blue-800);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
  }
  .btn-accent:hover { background: var(--blue-50); border-color: var(--blue-50); }

  .btn-small {
    min-height: 30px;
    padding: var(--space-1) var(--space-3);
    font-size: 0.8125rem;
  }

  .btn-danger {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--white);
  }
  .btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--slate-500);
    transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .icon-btn:hover { background: var(--danger-bg); color: var(--danger); }

  /* ---------- Header ---------- */
  .app-header {
    --focus-ring: #fde68a; /* light amber reads clearly on the blue band */
    position: relative;
    color: var(--white);
    padding: var(--space-5) var(--space-6) calc(var(--space-6) + var(--space-5));
    background:
      radial-gradient(ellipse 60% 120% at 100% 0%, rgba(96, 165, 250, 0.45), transparent 60%),
      linear-gradient(120deg, var(--blue-950) 0%, var(--blue-800) 50%, var(--blue-600) 100%);
  }

  .header-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-4);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .wordmark-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: var(--radius);
    background: var(--white);
    color: var(--blue-700);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
  }
  .wordmark-sub {
    padding-left: var(--space-3);
    border-left: 1px solid rgba(255, 255, 255, 0.35);
    font-weight: 400;
    font-size: 0.95rem;
    letter-spacing: 0;
    color: var(--blue-100);
  }

  .demo-note {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    margin: 0;
    padding: var(--space-1) var(--space-3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.1);
    font-size: 0.8125rem;
    color: var(--blue-50);
  }

  .header-actions { margin-left: auto; }

  .summary {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--space-3);
    max-width: 920px;
    margin: var(--space-5) 0 0;
    padding: 0;
    list-style: none;
  }
  .summary li {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .summary .label {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--blue-100);
  }
  .summary .label::before {
    content: "";
    flex-shrink: 0;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--tile-dot, var(--blue-200));
  }
  .summary .value {
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .summary .tile-total      { --tile-dot: var(--white); background: rgba(255, 255, 255, 0.18); }
  .summary .tile-backlog    { --tile-dot: #c4b5fd; }
  .summary .tile-inprogress { --tile-dot: var(--blue-300); }
  .summary .tile-blocked    { --tile-dot: #fca5a5; }
  .summary .tile-done       { --tile-dot: #86efac; }
  .summary .is-overdue {
    --tile-dot: #fecaca;
    background: rgba(220, 38, 38, 0.45);
    border-color: rgba(254, 202, 202, 0.45);
  }

  /* ---------- Main + filter bar ---------- */
  main {
    position: relative;
    max-width: 1600px;
    margin: calc(var(--space-5) * -1) auto 0;
    padding: 0 var(--space-6) var(--space-6);
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-4);
    margin-bottom: var(--space-5);
    padding: var(--space-4) var(--space-5);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
  }
  .filters h2 {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin: 0;
    align-self: center;
    font-size: 0.95rem;
    color: var(--blue-800);
  }
  .filters h2 svg { color: var(--blue-600); }
  .filter-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 190px; }
  .filter-field label { font-size: 0.8125rem; font-weight: 600; color: var(--slate-700); }
  .filter-status {
    margin: 0 0 0 auto;
    align-self: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--blue-700);
  }
  .filter-status:empty { display: none; }

  input[type="text"], input[type="search"], input[type="date"], select, textarea {
    width: 100%;
    min-height: 40px;
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--slate-300);
    border-radius: var(--radius-sm);
    background: var(--white);
    transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  input:hover, select:hover, textarea:hover { border-color: var(--blue-300); }
  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 0;
    border-color: var(--blue-600);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
  }
  ::placeholder { color: var(--slate-500); }

  /* ---------- Insights: pie charts ---------- */
  .insights { margin-bottom: var(--space-5); }
  .insights-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: var(--space-2) var(--space-4);
    margin-bottom: var(--space-3);
  }
  .insights-head h2 {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin: 0;
    font-size: 0.95rem;
    color: var(--blue-800);
  }
  .insights-head h2 svg { color: var(--blue-600); }
  .insights-note { margin: 0; font-size: 0.8125rem; color: var(--color-text-muted); }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
    gap: var(--space-4);
  }
  .chart {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    align-items: center;
    gap: var(--space-3) var(--space-5);
    margin: 0;
    padding: var(--space-4) var(--space-5);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }
  .chart figcaption {
    grid-column: 1 / -1;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--color-heading);
  }
  .chart-donut { position: relative; width: 132px; height: 132px; }
  .chart-donut svg { display: block; width: 100%; height: 100%; }
  .chart-track { fill: none; stroke: var(--slate-100); stroke-width: 18; }
  .slice {
    fill: none;
    stroke-width: 18;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .chart.has-active .slice:not(.is-active) { opacity: 0.25; }
  .chart-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .chart-value { font-size: 1.5rem; font-weight: 700; line-height: 1.1; color: var(--color-heading); }
  .chart-sub { font-size: 0.75rem; color: var(--color-text-muted); }

  .chart-legend {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.8125rem;
  }
  .chart-legend li {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto 3.25em;
    align-items: center;
    gap: var(--space-2);
    padding: 2px var(--space-2);
    border-radius: 4px;
    color: var(--slate-700);
    transition: background-color var(--dur-fast) var(--ease);
  }
  .chart-legend li.is-active { background: var(--blue-50); color: var(--color-heading); }
  .chart-legend li.is-zero { color: var(--slate-500); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
  .legend-label { min-width: 0; overflow-wrap: anywhere; }
  .legend-count { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .legend-pct { text-align: right; color: var(--slate-500); font-variant-numeric: tabular-nums; }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
    align-items: start;
  }

  .column {
    --col-accent: var(--status-backlog);
    display: flex;
    flex-direction: column;
    min-height: 320px;
    background: var(--color-column);
    border-radius: var(--radius-lg);
    box-shadow: inset 0 4px 0 var(--col-accent);
    transition: background-color var(--dur-fast) var(--ease), outline-color var(--dur-fast) var(--ease);
  }
  .column[data-status="Backlog"]     { --col-accent: var(--status-backlog); }
  .column[data-status="In Progress"] { --col-accent: var(--status-inprogress); }
  .column[data-status="Blocked"]     { --col-accent: var(--status-blocked); }
  .column[data-status="Done"]        { --col-accent: var(--status-done); }
  .column.drag-over {
    background: var(--blue-100);
    outline: 2px dashed var(--blue-500);
    outline-offset: -2px;
  }

  .column-header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-4) var(--space-4) 0;
  }
  .column-header h2 { margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--color-heading); }
  .column-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--col-accent); }
  .column-desc { margin: 2px 0 0; padding: 0 var(--space-4); font-size: 0.78rem; color: var(--color-text-muted); }

  .count-badge {
    margin-left: auto;
    min-width: 28px;
    padding: 1px var(--space-2);
    border: 1px solid var(--blue-200);
    border-radius: var(--radius-pill);
    background: var(--white);
    color: var(--blue-800);
    font-size: 0.8rem;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    flex: 1;
    margin: 0;
    padding: var(--space-3);
    list-style: none;
  }

  .empty-col {
    padding: var(--space-5) var(--space-3);
    border: 2px dashed var(--blue-200);
    border-radius: var(--radius);
    text-align: center;
    font-size: 0.85rem;
    color: var(--color-text-muted);
    background: rgba(255, 255, 255, 0.45);
  }

  /* ---------- Card ---------- */
  .card {
    --card-accent: var(--prio-medium);
    position: relative;
    padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    box-shadow: inset 4px 0 0 var(--card-accent), var(--shadow-sm);
    cursor: grab;
    transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .card:hover {
    border-color: var(--blue-200);
    box-shadow: inset 4px 0 0 var(--card-accent), var(--shadow);
    transform: translateY(-1px);
  }
  .card:active { cursor: grabbing; }
  .card.is-menu-open { z-index: 5; } /* hover transform creates a stacking context; lift the card so its menu overlaps siblings */
  .card.is-dragging { opacity: 0.45; transform: none; }
  .card.prio-critical { --card-accent: var(--prio-critical); }
  .card.prio-high     { --card-accent: var(--prio-high); }
  .card.prio-medium   { --card-accent: var(--prio-medium); }
  .card.prio-low      { --card-accent: var(--prio-low); }
  .card.status-done { background: var(--slate-50); }
  .card.status-done .card-title { color: var(--slate-600); }

  .card-top {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin: -2px 0 var(--space-1);
  }
  .card-id {
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--blue-50);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--blue-700);
  }
  .card-top .icon-btn { margin-left: auto; margin-right: -6px; }

  .card-title { margin: 0 0 var(--space-1); font-size: 0.95rem; font-weight: 650; line-height: 1.35; color: var(--color-heading); overflow-wrap: anywhere; }
  .card-desc {
    margin: 0 0 var(--space-2);
    font-size: 0.8125rem;
    color: var(--color-text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }

  .card-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px var(--space-3);
    margin: 0 0 var(--space-3);
    padding-top: var(--space-2);
    border-top: 1px solid var(--slate-100);
    font-size: 0.8125rem;
  }
  .card-meta dt { color: var(--slate-500); }
  .card-meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--slate-700); }
  .card-meta dd.is-overdue { color: var(--danger); font-weight: 600; }

  .card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3); }

  .pill, .tag, .badge-overdue {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px var(--space-2);
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .pill-critical { background: var(--prio-critical-bg); color: var(--prio-critical-text); }
  .pill-high     { background: var(--prio-high-bg);     color: var(--prio-high-text); }
  .pill-medium   { background: var(--prio-medium-bg);   color: var(--blue-700); }
  .pill-low      { background: var(--prio-low-bg);      color: var(--prio-low-text); }
  .tag { background: var(--white); color: var(--blue-800); border: 1px solid var(--blue-200); border-radius: var(--radius-sm); }
  .badge-overdue { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

  .card-actions { position: relative; display: flex; align-items: center; gap: var(--space-2); }
  .card-actions .btn-small svg { transition: transform var(--dur-fast) var(--ease); }
  .card-actions [aria-expanded="true"] { background: var(--blue-50); border-color: var(--blue-300); }
  .card-actions [aria-expanded="true"] svg { transform: rotate(90deg); }

  .move-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    min-width: 180px;
    margin: 0;
    padding: var(--space-1);
    list-style: none;
    background: var(--white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    animation: pop-in var(--dur-fast) var(--ease);
  }
  .move-menu button {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    min-height: 34px;
    padding: var(--space-2) var(--space-3);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    text-align: left;
    font-size: 0.85rem;
    color: var(--slate-700);
  }
  .move-menu button svg { color: var(--blue-500); }
  .move-menu button:hover { background: var(--blue-50); color: var(--blue-900); }

  .confirm-delete {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-top: var(--space-3);
    padding: var(--space-2) var(--space-3);
    border: 1px solid var(--danger-border);
    border-radius: var(--radius-sm);
    background: var(--danger-bg);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--danger);
  }
  .confirm-delete span { margin-right: auto; }

  /* ---------- Modal + form ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-6) var(--space-4);
    overflow-y: auto;
    background: rgba(23, 37, 84, 0.55);
    backdrop-filter: blur(3px);
  }
  .modal-backdrop[hidden] { display: none; }

  .modal {
    width: 100%;
    max-width: 640px;
    overflow: hidden;
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    animation: pop-in var(--dur) var(--ease);
  }
  .modal::before {
    content: "";
    display: block;
    height: 4px;
    background: linear-gradient(90deg, var(--blue-800), var(--blue-500));
  }
  .modal-header {
    display: flex;
    align-items: center;
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--slate-200);
  }
  .modal-header h2 { margin: 0; font-size: 1.15rem; color: var(--color-heading); }
  .modal-header .icon-btn { margin-left: auto; }
  .modal-header .icon-btn:hover { background: var(--slate-100); color: var(--slate-900); }

  .task-form { padding: var(--space-5); }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }
  .form-field { display: flex; flex-direction: column; gap: var(--space-1); }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 0.85rem; font-weight: 600; color: var(--slate-700); }
  .req { color: var(--danger); }
  .hint { font-size: 0.75rem; font-weight: 400; color: var(--slate-500); }
  .form-field textarea { min-height: 96px; resize: vertical; }

  .form-field [aria-invalid="true"] { border-color: var(--danger); background: #fffafa; }
  .error { min-height: 1em; margin: 0; font-size: 0.78rem; font-weight: 600; color: var(--danger); }
  .error:empty { min-height: 0; }

  .form-footer {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-3);
    margin: var(--space-5) calc(var(--space-5) * -1) calc(var(--space-5) * -1);
    padding: var(--space-4) var(--space-5);
    border-top: 1px solid var(--slate-200);
    background: var(--slate-50);
  }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }

  /* ---------- Toasts ---------- */
  .toast-region {
    position: fixed;
    right: var(--space-4);
    bottom: var(--space-4);
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    max-width: min(380px, calc(100vw - 2rem));
  }
  .toast {
    display: flex;
    align-items: flex-start;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--blue-600);
    border-radius: var(--radius);
    background: var(--white);
    box-shadow: var(--shadow-lg);
    font-size: 0.9rem;
    animation: toast-in var(--dur) var(--ease);
  }
  .toast-success { border-left-color: var(--success); }
  .toast-warning { border-left-color: var(--prio-high); background: var(--warning-bg); }
  .toast-error   { border-left-color: var(--danger); }
  .toast-icon { font-weight: 700; color: var(--blue-600); }
  .toast-success .toast-icon { color: var(--success); }
  .toast-warning .toast-icon { color: var(--warning); }
  .toast-error .toast-icon   { color: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    .toast, .spinner, .column, .card, .btn, .icon-btn, .modal, .move-menu,
    .card-actions .btn-small svg, input, select, textarea, .slice, .chart-legend li {
      animation: none;
      transition: none;
    }
    .card:hover, .btn:active { transform: none; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: none; }
  }

  /* Columns stack below 768px */
  @media (max-width: 767px) {
    .app-header { padding: var(--space-4) var(--space-4) calc(var(--space-6) + var(--space-4)); }
    main { padding: 0 var(--space-4) var(--space-4); }
    .header-actions { margin-left: 0; width: 100%; }
    .header-actions .btn { width: 100%; }
    .summary li { padding: var(--space-2) var(--space-3); }
    .summary .value { font-size: 1.35rem; }
    .board { grid-template-columns: 1fr; }
    .column { min-height: 0; }
    .filters { flex-direction: column; align-items: stretch; padding: var(--space-4); }
    .filter-field { min-width: 0; }
    .filter-status { margin: 0; }
    .form-grid { grid-template-columns: 1fr; }
    .modal-backdrop { padding: var(--space-3); }
    .chart { padding: var(--space-4); gap: var(--space-3) var(--space-4); }
    .chart-donut { width: 112px; height: 112px; }
  }
</style>
</head>

<!-- =====================================================================

     ===================================================================== -->
<script>
"use strict";

/* =====================================================================
   CONFIG: change the email address here (and only here)
   ===================================================================== */
// FormSubmit AJAX endpoint. Replace YOUR_EMAIL@example.com with the
// mailbox that should receive new-task notifications. See the activation
// note in the HTML comment above this script.
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const FORMSUBMIT_TIMEOUT_MS = 15000;

const STATUSES = [
  { key: "Backlog",     desc: "Logged, not yet scheduled" },
  { key: "In Progress", desc: "Actively being worked" },
  { key: "Blocked",     desc: "Waiting on a dependency, vendor or approval" },
  { key: "Done",        desc: "Completed / closed" },
];
const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management",
];
const CATEGORIES = [
  "Application Development",
  "Infrastructure",
  "Cybersecurity",
  "Data",
  "Compliance",
  "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

// Inline SVG icons used inside rendered cards (static markup, never user data).
const svgIcon = (size, body) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
const ICONS = {
  close:   svgIcon(16, '<path d="M6 6l12 12M18 6L6 18"/>'),
  warning: svgIcon(12, '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'),
  chevron: svgIcon(14, '<path d="m9 6 6 6-6 6"/>'),
  arrow:   svgIcon(14, '<path d="M5 12h14M13 6l6 6-6 6"/>'),
};

/* =====================================================================
   STATE: the single source of truth. In memory only, never persisted.
   ===================================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  nextId: 1,
  // UI-only flags, also rendered from state:
  pendingDelete: null,  // task id showing the inline "Delete? Yes / No"
  openMoveMenu: null,   // task id whose "Move ▸" menu is open
  focusAfterRender: null, // { id, action } to restore keyboard focus
  sending: false,
};

/* =====================================================================
   HELPERS
   ===================================================================== */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Local date as YYYY-MM-DD (avoids UTC shifting the day).
function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function todayISO() {
  return toISODate(new Date());
}

function daysFromToday(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return toISODate(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric",
  });
}

function generateId() {
  const id = "ITPM-" + String(state.nextId).padStart(4, "0");
  state.nextId += 1;
  return id;
}

function slug(value) {
  return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function findTask(id) {
  return state.tasks.find((t) => t.id === id);
}

function optionsHtml(values, selected, emptyLabel) {
  const empty = emptyLabel != null
    ? `<option value="">${escapeHtml(emptyLabel)}</option>`
    : "";
  return empty + values.map((v) =>
    `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`
  ).join("");
}

/* =====================================================================
   SEED DATA: 8 demo tasks, due dates relative to today
   ===================================================================== */
function seedTasks() {
  const seed = [
    {
      title: "Migrate FX pricing service to AWS",

      project: "Vendor Management", category: "Vendor",

    },
    {

      project: "Data & Analytics", category: "Data",

    },
    {

      project: "Core Banking Upgrade", category: "Application Development",

    },
    {

/* =====================================================================
   RENDERING: everything on the board is rebuilt from state
   ===================================================================== */
function renderBoard() {
  const board = document.getElementById("board");
  const visible = applyFilters(state.tasks);

  board.innerHTML = STATUSES.map((col) => {
    const colTasks = visible.filter((t) => t.status === col.key);
    const totalInCol = state.tasks.filter((t) => t.status === col.key).length;
    const headingId = "col-" + slug(col.key);
    const countLabel = colTasks.length === totalInCol
      ? String(totalInCol)
      : `${colTasks.length} of ${totalInCol}`;
    const cards = colTasks.length
      ? colTasks.map(renderCard).join("")
      : `<li class="empty-col">${totalInCol ? "No tasks match the filters" : "No tasks. Drop a card here."}</li>`;

    return `
      <section class="column" data-status="${escapeHtml(col.key)}" aria-labelledby="${headingId}">
        <div class="column-header">
          <span class="column-dot" aria-hidden="true"></span>
          <h2 id="${headingId}">${escapeHtml(col.key)}</h2>
          <span class="count-badge" aria-label="${escapeHtml(countLabel)} tasks">${escapeHtml(countLabel)}</span>
        </div>
        <p class="column-desc">${escapeHtml(col.desc)}</p>
        <ul class="card-list">${cards}</ul>
      </section>`;
  }).join("");

  renderSummary();
  renderCharts(visible);
  renderFilterStatus(visible.length);
  restoreFocus();
}

/* ---------- Pie charts (inline SVG donuts) ---------- */
// Slice colours follow the entity (same tokens as the board), never its rank.
const STATUS_COLORS   = ["var(--status-backlog)", "var(--status-inprogress)", "var(--status-blocked)", "var(--status-done)"];
const PRIORITY_COLORS = ["var(--prio-critical)", "var(--prio-high)", "var(--prio-medium)", "var(--prio-low)"];
const PROJECT_COLORS  = PROJECTS.map((_, i) => `var(--viz-${i + 1})`);

function renderCharts(tasks) {
  const tally = (key, values) =>
    values.map((label) => ({ label, count: tasks.filter((t) => t[key] === label).length }));

  renderPie("chart-status",   "Tasks by status",   tally("status", STATUSES.map((s) => s.key)), STATUS_COLORS);
  renderPie("chart-priority", "Tasks by priority", tally("priority", PRIORITIES), PRIORITY_COLORS);
  renderPie("chart-project",  "Tasks by project",  tally("project", PROJECTS), PROJECT_COLORS);

  document.getElementById("insights-note").textContent = tasks.length === state.tasks.length
    ? `All ${tasks.length} tasks on the board`
    : `${tasks.length} of ${state.tasks.length} tasks matching the filters`;
}

function renderPie(id, title, slices, colors) {
  const total = slices.reduce((sum, s) => sum + s.count, 0);
  const R = 50;
  const C = 2 * Math.PI * R;
  // 2px surface gap between slices; none when a single slice fills the ring.
  const gap = slices.filter((s) => s.count).length > 1 ? 2 : 0;
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);

  let offset = 0;
  const arcs = slices.map((s, i) => {
    if (!s.count) return "";
    const len = (s.count / total) * C;
    const arc = `<circle class="slice" data-i="${i}" cx="60" cy="60" r="${R}"
        style="stroke:${colors[i]}" stroke-dasharray="${Math.max(len - gap, 0.5).toFixed(2)} ${C.toFixed(2)}"
        stroke-dashoffset="${(-offset).toFixed(2)}"><title>${escapeHtml(s.label)}: ${s.count} (${pct(s.count)}%)</title></circle>`;
    offset += len;
    return arc;
  }).join("");

  const legend = slices.map((s, i) => `
    <li data-i="${i}"${s.count ? "" : ' class="is-zero"'}>
      <span class="legend-swatch" style="background:${colors[i]}" aria-hidden="true"></span>
      <span class="legend-label">${escapeHtml(s.label)}</span>
      <span class="legend-count">${s.count}</span>
      <span class="legend-pct">${pct(s.count)}%</span>
    </li>`).join("");

  const summary = slices.map((s) => `${s.label} ${s.count}`).join(", ");
  const el = document.getElementById(id);
  el.classList.remove("has-active");
  el.dataset.total = total;
  el.innerHTML = `
    <figcaption>${escapeHtml(title)}</figcaption>
    <div class="chart-donut">
      <svg viewBox="0 0 120 120" role="img" aria-label="${escapeHtml(`${title}: ${summary}`)}">
        <g transform="rotate(-90 60 60)">
          <circle class="chart-track" cx="60" cy="60" r="${R}"/>
          ${arcs}
        </g>
      </svg>
      <div class="chart-center" aria-hidden="true">
        <span class="chart-value">${total}</span>
        <span class="chart-sub">${total === 1 ? "task" : "tasks"}</span>
      </div>
    </div>
    <ul class="chart-legend">${legend}</ul>`;
}

// Hover a slice or legend row: emphasise it and show its share in the centre.
function setChartHighlight(chart, index) {
  chart.classList.toggle("has-active", index != null);
  chart.querySelectorAll("[data-i]").forEach((n) =>
    n.classList.toggle("is-active", n.dataset.i === index));
  const value = chart.querySelector(".chart-value");
  const sub = chart.querySelector(".chart-sub");
  const total = Number(chart.dataset.total);
  if (index == null) {
    value.textContent = total;
    sub.textContent = total === 1 ? "task" : "tasks";
    return;
  }
  const row = chart.querySelector(`.chart-legend [data-i="${index}"]`);
  value.textContent = row.querySelector(".legend-count").textContent;
  sub.textContent = row.querySelector(".legend-pct").textContent;
}

function handleChartHover(event) {
  const chart = event.target.closest(".chart");
  if (!chart) return;
  const mark = event.target.closest("[data-i]");
  setChartHighlight(chart, mark ? mark.dataset.i : null);
}

function handleChartLeave(event) {
  const chart = event.target.closest(".chart");
  if (chart && !chart.contains(event.relatedTarget)) setChartHighlight(chart, null);
}

function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = slug(task.priority);
  const overdue = isOverdue(task);
  const menuOpen = state.openMoveMenu === task.id;
  const confirming = state.pendingDelete === task.id;

  const moveMenu = menuOpen
    ? `<ul class="move-menu" role="menu" aria-label="Move ${id} to">
        ${STATUSES.filter((s) => s.key !== task.status).map((s) => `
          <li role="none">
            <button type="button" role="menuitem" data-action="move-to" data-status="${escapeHtml(s.key)}">
              ${ICONS.arrow} ${escapeHtml(s.key)}
            </button>
          </li>`).join("")}
      </ul>`
    : "";

  const confirm = confirming
    ? `<div class="confirm-delete" role="group" aria-label="Confirm delete ${id}">
        <span>Delete?</span>
        <button type="button" class="btn btn-small btn-danger" data-action="delete-yes">Yes</button>
        <button type="button" class="btn btn-small" data-action="delete-no">No</button>
      </div>`
    : "";

  return `
    <li class="card prio-${prio} status-${slug(task.status)}${menuOpen ? " is-menu-open" : ""}" draggable="true" data-id="${id}">
      <div class="card-top">
        <span class="card-id">${id}</span>
        ${overdue ? `<span class="badge-overdue">${ICONS.warning} Overdue</span>` : ""}
        <button type="button" class="icon-btn" data-action="delete" aria-label="Delete task ${id}">${ICONS.close}</button>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      ${task.description ? `<p class="card-desc" title="${escapeHtml(task.description)}">${escapeHtml(task.description)}</p>` : ""}
      <dl class="card-meta">
        <dt>Project</dt><dd>${escapeHtml(task.project)}</dd>
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd class="${overdue ? "is-overdue" : ""}"><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="card-tags">
        <span class="pill pill-${prio}">Priority: ${escapeHtml(task.priority)}</span>
        <span class="tag">${escapeHtml(task.category)}</span>
      </div>
      <div class="card-actions">
        <button type="button" class="btn btn-small" data-action="move"
          aria-haspopup="true" aria-expanded="${menuOpen}" aria-label="Move ${id} to another column">Move ${ICONS.chevron}</button>
        ${moveMenu}
      </div>
      ${confirm}
    </li>`;
}

function renderSummary() {
  const count = (status) => state.tasks.filter((t) => t.status === status).length;
  document.getElementById("sum-total").textContent = state.tasks.length;
  document.getElementById("sum-backlog").textContent = count("Backlog");
  document.getElementById("sum-inprogress").textContent = count("In Progress");
  document.getElementById("sum-blocked").textContent = count("Blocked");
  document.getElementById("sum-done").textContent = count("Done");
  document.getElementById("sum-overdue").textContent = state.tasks.filter(isOverdue).length;
}

function renderFilterStatus(visibleCount) {
  const f = state.filters;
  const active = f.project || f.assignee.trim() || f.priority;
  document.getElementById("filter-status").textContent = active
    ? `Showing ${visibleCount} of ${state.tasks.length} tasks`
    : "";
}

// After a re-render, return focus to the control the user was on.
function restoreFocus() {
  const target = state.focusAfterRender;
  state.focusAfterRender = null;
  if (!target) return;
  const card = document.querySelector(`.card[data-id="${CSS.escape(target.id)}"]`);
  const el = card && card.querySelector(`[data-action="${target.action}"]`);
  if (el) el.focus();
  else document.getElementById("board").focus();
}

/* =====================================================================
   ACTIONS: mutate state, then re-render
   ===================================================================== */
function addTask(data) {
  const task = {
    id: generateId(),
    title: data.title.trim(),
    description: data.description.trim(),
    project: data.project,
    category: data.category,
    assignee: data.assignee.trim(),
    priority: data.priority,
    dueDate: data.dueDate,
    status: data.status,
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = findTask(id);
  if (!task || !STATUSES.some((s) => s.key === status)) return;
  const changed = task.status !== status;
  task.status = status;
  state.openMoveMenu = null;
  state.pendingDelete = null;
  renderBoard();
  if (changed) showToast(`${task.id} moved to ${status}`, "info");
}

function deleteTask(id) {
  const task = findTask(id);
  if (!task) return;
  state.tasks = state.tasks.filter((t) => t.id !== id);
  state.pendingDelete = null;
  state.openMoveMenu = null;
  renderBoard();
  showToast(`${task.id} deleted`, "info");
}

// Pure function: returns the tasks that match the current filters.
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter((t) =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* =====================================================================
   TOASTS
   ===================================================================== */
function showToast(message, type = "info", duration = 4000) {
  const region = document.getElementById("toast-region");
  const icons = { success: "✓", warning: "⚠", error: "✕", info: "ⓘ" };
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;

  const icon = document.createElement("span");
  icon.className = "toast-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.textContent = icons[type] || icons.info;

  const text = document.createElement("span");
  text.textContent = message; // textContent: never parsed as HTML

  toast.append(icon, text);
  region.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

/* =====================================================================
   FORMSUBMIT: email notification (sends data only to the endpoint)
   ===================================================================== */
async function notifyNewTask(task) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), FORMSUBMIT_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        _subject: `[IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    const json = await res.json();
    // FormSubmit can answer 200 with success:"false" (e.g. not yet activated).
    if (json && String(json.success) === "false") {
      throw new Error(`FormSubmit rejected: ${json.message || "unknown reason"}`);
    }
    return json;
  } finally {
    clearTimeout(timer);
  }
}

/* =====================================================================
   FORM: populate, read, validate, submit
   ===================================================================== */
const FORM_FIELDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function populateSelects() {
  document.getElementById("filter-project").innerHTML = optionsHtml(PROJECTS, "", "All projects");
  document.getElementById("filter-priority").innerHTML = optionsHtml(PRIORITIES, "", "All priorities");
  document.getElementById("f-project").innerHTML = optionsHtml(PROJECTS, PROJECTS[0]);
  document.getElementById("f-category").innerHTML = optionsHtml(CATEGORIES, CATEGORIES[0]);
  document.getElementById("f-priority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("f-status").innerHTML = optionsHtml(STATUSES.map((s) => s.key), "Backlog");
}

function setFormDefaults() {
  document.getElementById("f-priority").value = "Medium";
  document.getElementById("f-status").value = "Backlog";
  document.getElementById("f-dueDate").min = todayISO();
}

function readForm() {
  const data = {};
  FORM_FIELDS.forEach((name) => { data[name] = document.getElementById("f-" + name).value; });
  return data;
}

function validateForm(data) {
  const errors = {};
  const title = data.title.trim();
  if (!title) errors.title = "Task title is required.";
  else if (title.length > 80) errors.title = "Task title must be 80 characters or fewer.";

  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";

  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";

  if (!data.assignee.trim()) errors.assignee = "Assignee is required.";

  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";

  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  if (!STATUSES.some((s) => s.key === data.status)) errors.status = "Choose a status.";
  return errors;
}

function showFieldError(name, message) {
  const input = document.getElementById("f-" + name);
  document.getElementById(`f-${name}-error`).textContent = message || "";
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

function showErrors(errors) {
  FORM_FIELDS.forEach((name) => showFieldError(name, errors[name]));
}

function setSending(isSending) {
  state.sending = isSending;
  const btn = document.getElementById("submit-task");
  btn.disabled = isSending;
  btn.setAttribute("aria-busy", String(isSending));
  btn.innerHTML = isSending
    ? `<span class="spinner" aria-hidden="true"></span> Sending…`
    : "Add Task";
}

async function handleSubmit(event) {
  event.preventDefault();
  if (state.sending) return;

  const data = readForm();
  const errors = validateForm(data);
  showErrors(errors);
  const firstInvalid = FORM_FIELDS.find((name) => errors[name]);
  if (firstInvalid) {
    document.getElementById("f-" + firstInvalid).focus();
    return;
  }

  // Optimistic UI: the card appears right away and the email goes out in parallel.
  const task = addTask(data);
  event.target.reset();
  setFormDefaults();
  showErrors({});
  showToast(`Task ${task.id} added to ${task.status}`, "success");
  document.getElementById("f-title").focus();

  setSending(true);
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}`, "info");
  } catch (err) {
    console.warn("FormSubmit notification failed:", err);
    showToast("Card added locally — email notification failed", "warning", 6000);
  } finally {
    setSending(false);
  }
}

/* =====================================================================
   MODAL: open/close, Esc, backdrop click, simple focus trap
   ===================================================================== */
let lastFocusBeforeModal = null;

function openModal() {
  lastFocusBeforeModal = document.activeElement;
  setFormDefaults();
  document.getElementById("modal-backdrop").hidden = false;
  document.getElementById("f-title").focus();
}

function closeModal() {
  document.getElementById("modal-backdrop").hidden = true;
  showErrors({});
  if (lastFocusBeforeModal) lastFocusBeforeModal.focus();
}

function isModalOpen() {
  return !document.getElementById("modal-backdrop").hidden;
}

function trapFocus(event) {
  if (event.key !== "Tab" || !isModalOpen()) return;
  const focusables = Array.from(document.getElementById("add-task-modal").querySelectorAll(
    "button:not([disabled]), input, select, textarea"
  ));
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
}

/* =====================================================================
   BOARD EVENTS: delegated, so they survive every re-render
   ===================================================================== */
function handleBoardClick(event) {
  const btn = event.target.closest("button[data-action]");
  if (!btn) return;
  const card = btn.closest(".card");
  if (!card) return;
  const id = card.dataset.id;

  switch (btn.dataset.action) {
    case "move":
      state.openMoveMenu = state.openMoveMenu === id ? null : id;
      state.pendingDelete = null;
      state.focusAfterRender = { id, action: state.openMoveMenu ? "move-to" : "move" };
      renderBoard();
      break;
    case "move-to":
      state.focusAfterRender = { id, action: "move" };
      moveTask(id, btn.dataset.status);
      break;
    case "delete":
      state.pendingDelete = id;
      state.openMoveMenu = null;
      state.focusAfterRender = { id, action: "delete-no" };
      renderBoard();
      break;
    case "delete-no":
      state.pendingDelete = null;
      state.focusAfterRender = { id, action: "delete" };
      renderBoard();
      break;
    case "delete-yes":
      deleteTask(id);
      break;
  }
}

// Close an open move menu when the user clicks anywhere else.
function handleDocumentClick(event) {
  if (!state.openMoveMenu) return;
  if (event.target.closest(".card-actions")) return;
  state.openMoveMenu = null;
  renderBoard();
}

function handleKeydown(event) {
  if (event.key !== "Escape") return;
  if (isModalOpen()) { closeModal(); return; }
  if (state.openMoveMenu) {
    state.focusAfterRender = { id: state.openMoveMenu, action: "move" };
    state.openMoveMenu = null;
    renderBoard();
  } else if (state.pendingDelete) {
    state.focusAfterRender = { id: state.pendingDelete, action: "delete" };
    state.pendingDelete = null;
    renderBoard();
  }
}

/* ---------- Native HTML5 drag and drop ---------- */
function handleDragStart(event) {
  const card = event.target.closest(".card");
  if (!card) return;
  event.dataTransfer.setData("text/plain", card.dataset.id);
  event.dataTransfer.effectAllowed = "move";
  card.classList.add("is-dragging");
}

function handleDragEnd(event) {
  const card = event.target.closest(".card");
  if (card) card.classList.remove("is-dragging");
  document.querySelectorAll(".column.drag-over").forEach((c) => c.classList.remove("drag-over"));
}

function handleDragOver(event) {
  const column = event.target.closest(".column");
  if (!column) return;
  event.preventDefault(); // allows the drop
  event.dataTransfer.dropEffect = "move";
  column.classList.add("drag-over");
}

function handleDragLeave(event) {
  const column = event.target.closest(".column");
  if (column && !column.contains(event.relatedTarget)) column.classList.remove("drag-over");
}

function handleDrop(event) {
  const column = event.target.closest(".column");
  if (!column) return;
  event.preventDefault();
  column.classList.remove("drag-over");
  const id = event.dataTransfer.getData("text/plain");
  if (id) moveTask(id, column.dataset.status);
}

/* ---------- Filter bar ---------- */
function bindFilters() {
  const project = document.getElementById("filter-project");
  const assignee = document.getElementById("filter-assignee");
  const priority = document.getElementById("filter-priority");

  project.addEventListener("change", () => { state.filters.project = project.value; renderBoard(); });
  priority.addEventListener("change", () => { state.filters.priority = priority.value; renderBoard(); });
  assignee.addEventListener("input", () => { state.filters.assignee = assignee.value; renderBoard(); });

  document.getElementById("clear-filters").addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "" };
    project.value = ""; assignee.value = ""; priority.value = "";
    renderBoard();
  });
}

/* =====================================================================
   INIT
   ===================================================================== */
function init() {
  populateSelects();
  setFormDefaults();
  seedTasks();

  const board = document.getElementById("board");
  board.tabIndex = -1; // fallback focus target after deletes
  board.addEventListener("click", handleBoardClick);
  board.addEventListener("dragstart", handleDragStart);
  board.addEventListener("dragend", handleDragEnd);
  board.addEventListener("dragover", handleDragOver);
  board.addEventListener("dragleave", handleDragLeave);
  board.addEventListener("drop", handleDrop);
  document.addEventListener("click", handleDocumentClick);
  document.addEventListener("keydown", handleKeydown);
  document.addEventListener("keydown", trapFocus);

  bindFilters();

  const insights = document.getElementById("insights");
  insights.addEventListener("pointerover", handleChartHover);
  insights.addEventListener("pointerout", handleChartLeave);

  document.getElementById("open-add-task").addEventListener("click", openModal);
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("cancel-modal").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") closeModal();
  });

  const form = document.getElementById("task-form");
  form.addEventListener("submit", handleSubmit);
  // Clear a field's error as soon as the user edits it.
  form.addEventListener("input", (e) => {
    const name = e.target.name;
    if (name && e.target.getAttribute("aria-invalid") === "true") showFieldError(name, "");
  });

  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
